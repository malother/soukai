name: Build debug APK

# Why this exists: the dev VM cannot download Android SDK artifacts
# (storage.googleapis.com is blocked by the proxy, 403), so a local
# `flutter build apk` fails before compiling. GitHub Actions builds the
# APK in the cloud instead — Ali downloads it from the run's artifacts
# and installs it on his phone to test the real flow.
# Runs on every push to main and on manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soukai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
