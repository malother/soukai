analyzer:
  exclude:
    - build/**
    - android/**
  errors:
    # Flutter 3.50 deprecates package:flutter/material.dart in favour of
    # package:material_ui. The import still works, but the analyzer reports
    # it as info and exits non-zero, which fails CI. Ignored until the
    # migration to material_ui (polish phase).
    deprecated_member_use: ignore
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
